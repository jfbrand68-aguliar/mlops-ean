# Despliegue automático de la API en Azure App Service (plan B, en lugar de Container Apps)
# Se ejecuta en cada push a main (excepto si solo cambia index.html) o a mano desde la pestaña Actions
name: Desplegar API en Azure

on:
  push:
    branches: [main]
    paths-ignore: ["index.html"]   # el frontend vive en Storage, no requiere reconstruir el Docker
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-mlops-ean
  ACR_NAME: acrmlopsean71
  APP_NAME: api-mlops-ean71
  IMAGE: acrmlopsean71.azurecr.io/api-mlops-ean:${{ github.sha }}   # cada versión con la etiqueta del commit

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código del repositorio
      - uses: actions/checkout@v4

      # 2. Inicia sesión en Azure con la cuenta de servicio
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Construye la imagen Docker y la sube al Container Registry
      - name: Construir y subir imagen
        run: |
          az acr login --name $ACR_NAME
          docker build -t $IMAGE .
          docker push $IMAGE

      # 4. Configura la Web App: secretos de Databricks, puerto y la imagen nueva
      - name: Actualizar la API en App Service
        env:
          DB_URL: ${{ secrets.DATABRICKS_URL }}
          DB_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # Variables de entorno que lee main.py (y el puerto donde escucha Uvicorn)
          az webapp config appsettings set -n $APP_NAME -g $RESOURCE_GROUP \
            --settings DATABRICKS_URL="$DB_URL" DATABRICKS_TOKEN="$DB_TOKEN" WEBSITES_PORT=8000 \
            --output none

          # Imagen a ejecutar y credenciales para descargarla del registry
          ACR_PASSWORD=$(az acr credential show -n $ACR_NAME --query "passwords[0].value" -o tsv)
          az webapp config container set -n $APP_NAME -g $RESOURCE_GROUP \
            --container-image-name $IMAGE \
            --container-registry-url https://$ACR_NAME.azurecr.io \
            --container-registry-user $ACR_NAME \
            --container-registry-password "$ACR_PASSWORD" \
            --output none

          az webapp restart -n $APP_NAME -g $RESOURCE_GROUP

      # 5. Muestra la URL pública de la API
      - name: URL de la API
        run: |
          HOST=$(az webapp show -n $APP_NAME -g $RESOURCE_GROUP --query defaultHostName -o tsv)
          echo "API publicada en: https://$HOST"
          echo "Pruebe: https://$HOST/health"
